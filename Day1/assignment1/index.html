<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <img src="pfp.png" alt="Profile Avatar" class="avatar">

    <h2>John Doe</h2>
    <h4>Software Engineer</h4>

    <div class="socials">
      <a href="#"><img src="social.png" alt="GitHub"></a>
      <a href="#"><img src="social.png" alt="Twitter"></a>
      <a href="#"><img src="social.png" alt="LinkedIn"></a>
    </div>
  </div>

</body>
</html>
